<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Tahoma, 'Leelawadee UI', sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="520" fill="#fff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">Call convention: L stack, instance และ pending frame</text>
<rect x="60" y="60" width="300" height="440" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="75" y="82" font-size="13" text-anchor="start" fill="#0f172a" font-weight="bold">L stack (byte array)</text>
<rect x="75" y="95" width="270" height="70" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="210.0" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">OB1 frame</text>
<text x="210.0" y="132" text-anchor="middle" font-size="11" fill="#475569">VAR_TEMP ของ OB (tempBytes)</text>
<rect x="75" y="170" width="270" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="210.0" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">FB frame</text>
<text x="210.0" y="207" text-anchor="middle" font-size="11" fill="#475569">VAR_TEMP ของ FB · FP ชี้ที่นี่</text>
<rect x="75" y="245" width="270" height="90" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="210.0" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Pending FC frame</text>
<text x="210.0" y="282" text-anchor="middle" font-size="11" fill="#475569">RET_VAL · Input · Output · InOut(Ptr) = paramBytes</text>
<rect x="75" y="340" width="270" height="70" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="210.0" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">FC temps</text>
<text x="210.0" y="377" text-anchor="middle" font-size="11" fill="#475569">tempBytes (VM จองตอน opCall)</text>
<text x="75" y="440" font-size="12" text-anchor="start" fill="#475569">LTop ↓ เพิ่มเมื่อเรียก, คืนเมื่อ return</text>
<rect x="420" y="60" width="520" height="130" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="430" y="80" text-anchor="start" font-size="13" font-weight="bold" fill="#0f172a">เรียก FC</text>
<text x="430" y="97" text-anchor="start" font-size="11" fill="#475569">opFrameAlloc paramBytes   → จอง frame ล่วงหน้า (Pending)</text>
<text x="430" y="112" text-anchor="start" font-size="11" fill="#475569">opAddrNewFrame ofs + opStore  → เขียน parameter</text>
<text x="430" y="127" text-anchor="start" font-size="11" fill="#475569">opCall idx   → FP = base, จอง temp, execute</text>
<text x="430" y="142" text-anchor="start" font-size="11" fill="#475569">opAddrNewFrame 0 + opLoad   → RET_VAL / output</text>
<text x="430" y="157" text-anchor="start" font-size="11" fill="#475569">opFrameFree</text>
<rect x="420" y="210" width="520" height="130" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="430" y="230" text-anchor="start" font-size="13" font-weight="bold" fill="#0f172a">เรียก FB (multi / single instance)</text>
<text x="430" y="247" text-anchor="start" font-size="11" fill="#475569">เขียน input ลง instance (addr + offset)</text>
<text x="430" y="262" text-anchor="start" font-size="11" fill="#475569">push instance address</text>
<text x="430" y="277" text-anchor="start" font-size="11" fill="#475569">opCallFB idx  → Inst = address, จอง temp</text>
<text x="430" y="292" text-anchor="start" font-size="11" fill="#475569">copy output ออกจาก instance (=&gt;)</text>
<rect x="420" y="360" width="520" height="130" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="430" y="380" text-anchor="start" font-size="13" font-weight="bold" fill="#0f172a">FB instance layout (ใน DB หรือ static ของ FB แม่)</text>
<text x="430" y="397" text-anchor="start" font-size="11" fill="#475569">[Input][Output][InOut = Ptr 8 byte][Static]</text>
<text x="430" y="412" text-anchor="start" font-size="11" fill="#475569">multi-instance = static ที่เป็น FB อื่น</text>
<text x="430" y="427" text-anchor="start" font-size="11" fill="#475569">system FB (TON ...) ใช้ layout คงที่ (ดู SVPL_Spec)</text>
</svg>