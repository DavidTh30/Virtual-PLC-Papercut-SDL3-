<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Tahoma, 'Leelawadee UI', sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="380" fill="#fff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">Roadmap แนะนำ</text>
<rect x="30" y="80" width="180" height="230" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="120.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Phase 1 · Virtual PLC core</text>
<text x="120.0" y="117" text-anchor="middle" font-size="11" fill="#475569">ใช้ scl_vm เป็นฐาน</text>
<text x="120.0" y="132" text-anchor="middle" font-size="11" fill="#475569">scheduler + mode</text>
<text x="120.0" y="147" text-anchor="middle" font-size="11" fill="#475569">retain, diag buffer</text>
<line x1="210" y1="195" x2="226" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="226" y="80" width="180" height="230" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
<text x="316.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Phase 2 · Download</text>
<text x="316.0" y="117" text-anchor="middle" font-size="11" fill="#475569">Load protocol</text>
<text x="316.0" y="132" text-anchor="middle" font-size="11" fill="#475569">validator + activate</text>
<text x="316.0" y="147" text-anchor="middle" font-size="11" fill="#475569">IDE: Online menu</text>
<line x1="406" y1="195" x2="422" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="422" y="80" width="180" height="230" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="512.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Phase 3 · Monitor</text>
<text x="512.0" y="117" text-anchor="middle" font-size="11" fill="#475569">watch / force</text>
<text x="512.0" y="132" text-anchor="middle" font-size="11" fill="#475569">online status ใน editor</text>
<text x="512.0" y="147" text-anchor="middle" font-size="11" fill="#475569">S7 server (HMI)</text>
<line x1="602" y1="195" x2="618" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="618" y="80" width="180" height="230" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="708.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Phase 4 · Language+</text>
<text x="708.0" y="117" text-anchor="middle" font-size="11" fill="#475569">String conv., VARIANT</text>
<text x="708.0" y="132" text-anchor="middle" font-size="11" fill="#475569">Array[*], REF_TO</text>
<text x="708.0" y="147" text-anchor="middle" font-size="11" fill="#475569">library / know-how</text>
<line x1="798" y1="195" x2="814" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="814" y="80" width="180" height="230" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="904.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Phase 5 · Production</text>
<text x="904.0" y="117" text-anchor="middle" font-size="11" fill="#475569">I/O drivers</text>
<text x="904.0" y="132" text-anchor="middle" font-size="11" fill="#475569">run-time download</text>
<text x="904.0" y="147" text-anchor="middle" font-size="11" fill="#475569">security, redundancy</text>
<text x="30" y="345" font-size="12" text-anchor="start" fill="#0f172a">ลำดับแนะนำ: ทำ Phase 1+2 ให้ใช้งานได้ก่อน แล้วค่อยเพิ่ม monitor และ feature ภาษา</text>
</svg>