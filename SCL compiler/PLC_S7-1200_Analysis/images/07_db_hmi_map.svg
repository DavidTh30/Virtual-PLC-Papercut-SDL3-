<text x="524" y="533.0" font-size="11">HMI ↔ PLC (พารามิเตอร์, retain)</text>
<rect x="740" y="521.0" width="18" height="14" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="764" y="533.0" font-size="11">padding / ไม่ใช้</text>
<text x="20" y="559.0" font-size="11" fill="#64748b">กฎ Standard access: Bool เรียงเป็น bit, Struct/Array/Int เริ่มที่ byte คู่ → จึงมี padding ที่ byte 11, 13, 19</text>
</svg>