<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Tahoma, 'Leelawadee UI', sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">รูปที่ 1  ภาพรวมระบบ Fluff Silo (กระบวนการ + ระบบควบคุม)</text>
  <text x="20" y="50" font-size="12" fill="#64748b">ส่วนกระบวนการเป็นแผนภาพแนวคิดที่อนุมานจากลำดับการทำงานในโปรแกรม (Blower → Screw → Paddle)</text>

  <!-- process area -->
  <rect x="20" y="65" width="960" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="86" font-weight="bold" fill="#334155">กระบวนการ (Field)</text>

  <!-- fill request arrow -->
  <line x1="150" y1="95" x2="150" y2="125" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="160" y="108" fill="#2563eb">วัตถุดิบเข้า (Fill_Request %Q1.0)</text>

  <!-- silo -->
  <path d="M90,130 L210,130 L210,250 L170,290 L130,290 L90,250 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-weight="bold">SILO</text>
  <!-- level -->
  <rect x="92" y="200" width="116" height="50" fill="#fde68a" opacity="0.8"/>
  <path d="M92,250 L130,288 L170,288 L208,250 Z" fill="#fde68a" opacity="0.8"/>
  <!-- paddles -->
  <g fill="#16a34a">
    <circle cx="115" cy="190" r="9"/><text x="115" y="194" text-anchor="middle" fill="#fff" font-size="10">P1</text>
    <circle cx="150" cy="190" r="9"/><text x="150" y="194" text-anchor="middle" fill="#fff" font-size="10">P2</text>
    <circle cx="185" cy="190" r="9"/><text x="185" y="194" text-anchor="middle" fill="#fff" font-size="10">P3</text>
  </g>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#166534">Paddle01..03 (K3..K5)</text>
  <!-- level sensor -->
  <rect x="216" y="160" width="16" height="70" fill="#7c3aed"/>
  <text x="240" y="185" fill="#7c3aed" font-size="12">Level sensor</text>
  <text x="240" y="200" fill="#7c3aed" font-size="12">0-10 V = 0-100 %</text>
  <text x="240" y="215" fill="#7c3aed" font-size="12">%IW64</text>

  <!-- screw -->
  <rect x="130" y="290" width="40" height="16" fill="#94a3b8"/>
  <rect x="170" y="292" width="260" height="22" rx="4" fill="#cbd5e1" stroke="#475569"/>
  <path d="M180,292 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22 m10,-22 l10,22" stroke="#475569"/>
  <text x="300" y="330" text-anchor="middle" font-weight="bold">Screw01 (K2)  ป้อนวัตถุดิบ</text>

  <!-- blower line -->
  <rect x="470" y="250" width="70" height="60" rx="30" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="505" y="285" text-anchor="middle" font-weight="bold">Blower</text>
  <text x="505" y="240" text-anchor="middle">Blower01 (K1) ลมลำเลียง</text>
  <line x1="430" y1="303" x2="468" y2="290" stroke="#475569" stroke-width="3"/>
  <path d="M540,280 L760,280" stroke="#475569" stroke-width="10" fill="none"/>
  <path d="M540,280 L760,280" stroke="#e2e8f0" stroke-width="6" fill="none"/>
  <line x1="600" y1="280" x2="740" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="650" y="268" text-anchor="middle">ท่อลำเลียง</text>

  <!-- consumer -->
  <rect x="770" y="225" width="190" height="95" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="865" y="255" text-anchor="middle" font-weight="bold">เครื่องปลายทาง</text>
  <text x="865" y="275" text-anchor="middle">(Consumer)</text>
  <text x="865" y="300" text-anchor="middle" fill="#ea580c">ExtRequest_In %I0.4</text>

  <!-- motor feedback note -->
  <rect x="560" y="95" width="400" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="575" y="117" font-weight="bold">ต่ออุปกรณ์ (มอเตอร์ 5 ตัว) มีสัญญาณ 3 เส้น</text>
  <text x="575" y="140">• _Run  (DQ)  → coil contactor K1..K5</text>
  <text x="575" y="160">• _FB   (DI, NO) ← aux contact = running feedback</text>
  <text x="575" y="180">• _OL   (DI, NC) ← overload relay (0 = trip)</text>
  <text x="575" y="198" fill="#64748b" font-size="12">รวม DI 10 จุด + DQ 5 จุด สำหรับมอเตอร์</text>

  <!-- control area -->
  <rect x="20" y="350" width="960" height="255" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="372" font-weight="bold" fill="#334155">ระบบควบคุม (Control cabinet)</text>

  <!-- panel -->
  <rect x="40" y="390" width="200" height="190" rx="8" fill="#fff" stroke="#475569"/>
  <text x="140" y="412" text-anchor="middle" font-weight="bold">หน้าตู้ (Panel)</text>
  <text x="55" y="435">PB_AutoStart  I0.1 (NO)</text>
  <text x="55" y="455">PB_AutoStop   I0.2 (NC)</text>
  <text x="55" y="475">PB_Reset      I0.3 (NO)</text>
  <circle cx="62" cy="500" r="7" fill="#16a34a"/><text x="75" y="504">Lamp_AutoRun Q0.5</text>
  <circle cx="62" cy="522" r="7" fill="#dc2626"/><text x="75" y="526">Lamp_Fault   Q0.6</text>
  <circle cx="62" cy="544" r="7" fill="#eab308"/><text x="75" y="548">Lamp_EStop   Q0.7</text>
  <text x="55" y="570" fill="#64748b" font-size="11">ปุ่ม E-Stop → Safety relay</text>

  <!-- safety relay -->
  <rect x="270" y="390" width="160" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="415" text-anchor="middle" font-weight="bold" fill="#b91c1c">Safety relay</text>
  <text x="350" y="435" text-anchor="middle">(เช่น 3SK1)</text>
  <text x="350" y="455" text-anchor="middle" fill="#b91c1c">EStop_OK → I0.0</text>
  <line x1="350" y1="390" x2="350" y2="345" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="358" y="365" fill="#dc2626" font-size="12">ตัดไฟ contactor ทั้งหมด (hardware)</text>

  <!-- PLC -->
  <rect x="460" y="390" width="250" height="190" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="585" y="413" text-anchor="middle" font-weight="bold" fill="#1d4ed8">PLC S7-1200</text>
  <rect x="475" y="425" width="135" height="140" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="542" y="445" text-anchor="middle" font-weight="bold">CPU 1214C</text>
  <text x="542" y="462" text-anchor="middle" font-size="11">DC/DC/RLY</text>
  <text x="485" y="485" font-size="12">DI14  I0.0–I1.5</text>
  <text x="485" y="503" font-size="12">DQ10  Q0.0–Q1.1</text>
  <text x="485" y="521" font-size="12">AI2   IW64 (AI0)</text>
  <text x="485" y="545" font-size="12">PROFINET</text>
  <rect x="615" y="425" width="80" height="140" fill="#e0e7ff" stroke="#1d4ed8"/>
  <text x="655" y="450" text-anchor="middle" font-weight="bold" font-size="12">SM 1221</text>
  <text x="655" y="468" text-anchor="middle" font-size="11">DI 8×24V</text>
  <text x="655" y="490" text-anchor="middle" font-size="11">slot 2</text>
  <text x="655" y="510" text-anchor="middle" font-size="11">I8.0–I8.7</text>
  <text x="655" y="530" text-anchor="middle" font-size="11">(ใช้ I8.0)</text>

  <!-- HMI -->
  <rect x="770" y="400" width="190" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="865" y="425" text-anchor="middle" font-weight="bold" fill="#15803d">FluffSilo HMI</text>
  <text x="865" y="448" text-anchor="middle">Protocol Siemens S7</text>
  <text x="865" y="468" text-anchor="middle">PUT/GET, Port 102</text>
  <text x="865" y="488" text-anchor="middle">Rack 0 / Slot 1</text>
  <text x="865" y="512" text-anchor="middle" font-weight="bold">DB10 "DB_HMI" (82 byte)</text>
  <line x1="712" y1="465" x2="768" y2="465" stroke="#16a34a" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="740" y="455" text-anchor="middle" font-size="11">Ethernet</text>

  <!-- connections -->
  <line x1="240" y1="455" x2="458" y2="500" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="440" x2="458" y2="450" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="585" y1="388" x2="585" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="578" y="340" text-anchor="end" fill="#2563eb" font-size="12">DQ → K1..K5, Fill_Request</text>
  <line x1="660" y1="320" x2="660" y2="388" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
  <text x="667" y="380" fill="#ea580c" font-size="12">DI/AI ← FB, OL, Level, Request</text>
</svg>
