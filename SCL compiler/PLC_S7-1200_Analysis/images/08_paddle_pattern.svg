<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Tahoma, 'Leelawadee UI', sans-serif" font-size="12">
<rect width="1000" height="400" fill="#fff"/>
<text x="20" y="30" font-size="18" font-weight="bold">รูปที่ 8  Paddle Patterns ค่าเริ่มต้น (6 step, รอบละ 30 s) และการข้าม step เมื่อ Paddle ใช้งานไม่ได้</text>

<rect x="160" y="80" width="208.0" height="26" fill="#bbf7d0" stroke="#475569"/>
<text x="264.0" y="98" text-anchor="middle" font-size="11">S1 M=1 8s</text>
<rect x="160" y="125" width="208.0" height="22" fill="#16a34a" rx="3"/>
<rect x="368.0" y="80" width="52.0" height="26" fill="#e2e8f0" stroke="#475569"/>
<text x="394.0" y="98" text-anchor="middle" font-size="11">S2 พัก 2s</text>
<rect x="420.0" y="80" width="208.0" height="26" fill="#bbf7d0" stroke="#475569"/>
<text x="524.0" y="98" text-anchor="middle" font-size="11">S3 M=2 8s</text>
<rect x="420.0" y="159" width="208.0" height="22" fill="#16a34a" rx="3"/>
<rect x="628.0" y="80" width="52.0" height="26" fill="#e2e8f0" stroke="#475569"/>
<text x="654.0" y="98" text-anchor="middle" font-size="11">S4 พัก 2s</text>
<rect x="680.0" y="80" width="208.0" height="26" fill="#bbf7d0" stroke="#475569"/>
<text x="784.0" y="98" text-anchor="middle" font-size="11">S5 M=4 8s</text>
<rect x="680.0" y="193" width="208.0" height="22" fill="#16a34a" rx="3"/>
<rect x="888.0" y="80" width="52.0" height="26" fill="#e2e8f0" stroke="#475569"/>
<text x="914.0" y="98" text-anchor="middle" font-size="11">S6 พัก 2s</text>
<text x="20" y="98" font-size="12" font-weight="bold">Step (Mask, Time)</text>
<text x="20" y="141" font-size="12">Paddle01 (bit0)</text>
<line x1="160" y1="147" x2="940" y2="147" stroke="#cbd5e1"/>
<text x="20" y="175" font-size="12">Paddle02 (bit1)</text>
<line x1="160" y1="181" x2="940" y2="181" stroke="#cbd5e1"/>
<text x="20" y="209" font-size="12">Paddle03 (bit2)</text>
<line x1="160" y1="215" x2="940" y2="215" stroke="#cbd5e1"/>
<text x="160" y="240" text-anchor="middle" font-size="10" fill="#64748b">0s</text>
<text x="290" y="240" text-anchor="middle" font-size="10" fill="#64748b">5s</text>
<text x="420" y="240" text-anchor="middle" font-size="10" fill="#64748b">10s</text>
<text x="550" y="240" text-anchor="middle" font-size="10" fill="#64748b">15s</text>
<text x="680" y="240" text-anchor="middle" font-size="10" fill="#64748b">20s</text>
<text x="810" y="240" text-anchor="middle" font-size="10" fill="#64748b">25s</text>
<text x="940" y="240" text-anchor="middle" font-size="10" fill="#64748b">30s</text>
<path d="M945,93 C1000,50 120,50 155,85" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
<text x="960" y="72" font-size="11" fill="#64748b">วนกลับ S1</text>
<text x="20" y="270" font-size="12" font-weight="bold">กฎการเลือก step (FB_PaddlePattern + FC_StepBlocked)</text>
<text x="20" y="290" font-size="12">• เริ่ม (Enable ↑): เริ่มค้นจาก step 1 เลือก step แรกที่ไม่ถูก block</text>
<text x="20" y="310" font-size="12">• หมดเวลา step: ไป step ถัดไปที่ไม่ถูก block (step พัก Mask=0 ไม่เคยถูก block)</text>
<text x="20" y="330" font-size="12">• step ปัจจุบันถูก block (Paddle ใน step Fault / E-Stop / Disable / Manual Stop): ข้ามไป step ถัดไปที่มี Paddle วิ่งได้ทันที (ข้าม step พักด้วย)</text>
<text x="20" y="350" font-size="12">• Interlock (Screw ไม่วิ่ง) ไม่นับว่า block · Enable = 0 → Paddle ทุกตัว OFF และครั้งหน้าเริ่ม step 1 ใหม่</text>
<text x="20" y="370" font-size="12">• ตัวอย่าง: Paddle01 trip ระหว่าง S1 → กระโดดไป S3 (Paddle02) ทันที ไม่รอพัก S2</text>
</svg>