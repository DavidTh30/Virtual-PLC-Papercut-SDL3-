<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Tahoma, 'Leelawadee UI', sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <style>
    .box{fill:#ede9fe;stroke:#6d28d9;stroke-width:2}
    .io{fill:#f1f5f9;stroke:#475569;stroke-width:1.5}
    .q{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5}
    .t{font-weight:bold;font-size:13px}
    .s{font-size:11px;fill:#475569}
    .l{stroke:#334155;stroke-width:1.3;fill:none}
    .r{stroke:#dc2626;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
    .g{stroke:#16a34a;stroke-width:1.3;fill:none;stroke-dasharray:4 3}
  </style>
  <rect width="1000" height="640" fill="#fff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">รูปที่ 3  การไหลของสัญญาณภายใน FB_FluffSilo (ลำดับการเรียกใน 1 scan)</text>

  <!-- inputs column -->
  <rect x="20" y="60" width="180" height="560" rx="8" class="io"/>
  <text x="110" y="82" text-anchor="middle" class="t">Inputs / DB_HMI.Cmd</text>
  <text x="32" y="110">EStop_OK  I0.0</text>
  <text x="32" y="128">DB_HMI.Cmd.EStop</text>
  <text x="32" y="146">PB_Reset / Cmd.ResetEStop</text>
  <text x="32" y="180">PB_AutoStart / Cmd.AutoStart</text>
  <text x="32" y="198">PB_AutoStop(NC) / Cmd.AutoStop</text>
  <text x="32" y="232">ExtRequest_In / Cmd.ExtRequest</text>
  <text x="32" y="266">DB_HMI.Delay[0..5]</text>
  <text x="32" y="300">DB_HMI.Pattern.*</text>
  <text x="32" y="350">Blower01_FB / _OL</text>
  <text x="32" y="368">Screw01_FB / _OL</text>
  <text x="32" y="386">Paddle01..03_FB / _OL</text>
  <text x="32" y="420">DB_HMI.DevCmd[0..39]</text>
  <text x="32" y="470">Silo_Level_AI  IW64</text>

  <!-- 1 estop -->
  <rect x="250" y="95" width="170" height="60" rx="6" class="box"/>
  <text x="335" y="117" text-anchor="middle" class="t">① E-Stop latch</text>
  <text x="335" y="134" text-anchor="middle" class="s">#EStopLatch, #resetPulse</text>
  <text x="335" y="148" text-anchor="middle" class="s">(R_TRIG ของ Reset)</text>
  <path d="M200,125 L248,125" class="l" marker-end="url(#a)"/>

  <!-- 2 params -->
  <rect x="250" y="220" width="170" height="70" rx="6" class="box"/>
  <text x="335" y="242" text-anchor="middle" class="t">② Request + Params</text>
  <text x="335" y="259" text-anchor="middle" class="s">#extReq = Input OR HMI</text>
  <text x="335" y="274" text-anchor="middle" class="s">ValidateParams, Tenths→TIME</text>
  <path d="M200,235 L248,240" class="l" marker-end="url(#a)"/>
  <path d="M200,265 L248,265" class="l" marker-end="url(#a)"/>

  <!-- 3 sequencer -->
  <rect x="470" y="70" width="200" height="190" rx="6" class="box"/>
  <text x="570" y="92" text-anchor="middle" class="t">③ #Seq : FB_Sequencer</text>
  <text x="482" y="115" class="s">in : CmdAutoStart (edge)</text>
  <text x="482" y="130" class="s">     CmdAutoStop (level)</text>
  <text x="482" y="145" class="s">     EStopActive, ExtRequest</text>
  <text x="482" y="160" class="s">     Blower/ScrewRunning (FB)</text>
  <text x="482" y="175" class="s">     T×6, RestartAfterBlowerTrip</text>
  <text x="482" y="198" class="s">out: AutoMode, PatternCmd</text>
  <text x="482" y="213" class="s">     Blower/Screw AutoStart/Stop</text>
  <text x="482" y="228" class="s">     ScrewInterlock, PaddleInterlock</text>
  <text x="482" y="243" class="s">     PaddleAutoStop</text>
  <path d="M200,189 L468,170" class="l" marker-end="url(#a)"/>
  <path d="M420,125 L468,140" class="l" marker-end="url(#a)"/>
  <path d="M420,250 L468,220" class="l" marker-end="url(#a)"/>

  <!-- 4 pattern -->
  <rect x="470" y="290" width="200" height="110" rx="6" class="box"/>
  <text x="570" y="312" text-anchor="middle" class="t">④ #Pattern : FB_PaddlePattern</text>
  <text x="482" y="334" class="s">in : Enable = Seq.PatternCmd</text>
  <text x="482" y="349" class="s">     Available[0..2] (scan ก่อน)</text>
  <text x="482" y="364" class="s">     StepCount, Mask[], StepTime[]</text>
  <text x="482" y="384" class="s">out: PaddleCmd[0..2], Active,</text>
  <text x="482" y="397" class="s">     CurrentStep, ElapsedTenths</text>
  <path d="M570,260 L570,288" class="l" marker-end="url(#a)"/>
  <path d="M200,300 L468,340" class="l" marker-end="url(#a)"/>

  <!-- 5 motors -->
  <rect x="720" y="70" width="140" height="56" rx="6" class="box"/><text x="790" y="92" text-anchor="middle" class="t">⑤ #Blower01</text><text x="790" y="110" text-anchor="middle" class="s">Interlock := FALSE</text>
  <rect x="720" y="140" width="140" height="56" rx="6" class="box"/><text x="790" y="162" text-anchor="middle" class="t">#Screw01</text><text x="790" y="180" text-anchor="middle" class="s">IL = NOT Blower_FB</text>
  <rect x="720" y="250" width="140" height="150" rx="6" class="box"/><text x="790" y="272" text-anchor="middle" class="t">#Paddle01..03</text>
  <text x="732" y="295" class="s">AutoStart =</text><text x="732" y="310" class="s">  Pattern.PaddleCmd[x]</text>
  <text x="732" y="330" class="s">AutoStop =</text><text x="732" y="345" class="s">  Seq.PaddleAutoStop</text>
  <text x="732" y="365" class="s">IL = NOT Screw_FB</text>
  <text x="732" y="385" class="s">(ทุกตัว FB_Motor)</text>
  <path d="M670,100 L718,98" class="l" marker-end="url(#a)"/>
  <path d="M670,165 L718,168" class="l" marker-end="url(#a)"/>
  <path d="M670,240 L718,290" class="l" marker-end="url(#a)"/>
  <path d="M670,345 L718,330" class="l" marker-end="url(#a)"/>
  <!-- common inputs to motors -->
  <path d="M420,140 L448,140 L448,432 L700,432 L700,90 L718,90" class="r" marker-end="url(#a)"/>
  <path d="M700,160 L718,160" class="r" marker-end="url(#a)"/>
  <path d="M700,300 L718,300" class="r" marker-end="url(#a)"/>
  <text x="456" y="448" class="s" fill="#dc2626">EStop := #EStopLatch, ResetFault := DevCmd OR #resetPulse (ทุกตัว)</text>
  <path d="M200,380 L230,380 L230,480 L880,480 L880,140 L862,140" class="l"/>
  <path d="M880,410 L862,380" class="l" marker-end="url(#a)"/>
  <path d="M880,180 L862,180" class="l" marker-end="url(#a)"/>
  <path d="M880,110 L862,110" class="l" marker-end="url(#a)"/>
  <path d="M200,420 L230,420" class="l"/>
  <text x="240" y="496" class="s">Feedback / OverloadOK และ DevCmd[dev×8+cmd] เข้าแต่ละ FB_Motor</text>

  <!-- available feedback loop -->
  <path d="M720,395 L672,395" class="g" marker-end="url(#a)"/>
  <text x="456" y="420" class="s" fill="#16a34a">Paddle.Available → avail[] (ใช้ใน scan ถัดไป)</text>

  <!-- outputs -->
  <rect x="900" y="60" width="90" height="360" rx="8" class="q"/>
  <text x="945" y="82" text-anchor="middle" class="t">⑥ Q</text>
  <text x="908" y="105" class="s">Q0.0 Blower</text>
  <text x="908" y="173" class="s">Q0.1 Screw</text>
  <text x="908" y="290" class="s">Q0.2 P01</text>
  <text x="908" y="310" class="s">Q0.3 P02</text>
  <text x="908" y="330" class="s">Q0.4 P03</text>
  <text x="908" y="365" class="s">Q0.5 Lamp Auto</text>
  <text x="908" y="382" class="s">Q0.6 Lamp Fault</text>
  <text x="908" y="399" class="s">Q0.7 Lamp EStop</text>
  <path d="M860,98 L898,102" class="l" marker-end="url(#a)"/>
  <path d="M860,168 L898,170" class="l" marker-end="url(#a)"/>
  <path d="M860,310 L898,310" class="l" marker-end="url(#a)"/>

  <!-- level -->
  <rect x="250" y="560" width="230" height="56" rx="6" class="box"/>
  <text x="365" y="582" text-anchor="middle" class="t">⑦ FC_ScaleAnalog + Hysteresis</text>
  <text x="365" y="600" text-anchor="middle" class="s">&lt;25 % ON, ≥90 % OFF, sensor fault = OFF</text>
  <path d="M200,470 C230,520 240,560 248,580" class="l" marker-end="url(#a)"/>
  <rect x="520" y="565" width="120" height="44" rx="6" class="q"/><text x="580" y="592" text-anchor="middle" class="s">Q1.0 Fill_Request</text>
  <path d="M480,588 L518,588" class="l" marker-end="url(#a)"/>

  <!-- HMI status -->
  <rect x="690" y="545" width="300" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="566" text-anchor="middle" class="t">⑧ Status → DB_HMI   ⑨ ล้าง pulse</text>
  <text x="702" y="586" class="s">Dev[0..4] ← #Motor.Status, Sys.* ← Seq/Pattern/EStop</text>
  <text x="702" y="602" class="s">Proc ← CurrentStep, ElapsedTenths, Level×10</text>
  <text x="702" y="618" class="s">Cmd.AutoStart/Stop/EStop/ResetEStop, DevCmd[] := FALSE</text>
</svg>
